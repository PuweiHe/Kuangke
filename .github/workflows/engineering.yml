name: Service and browser checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  agents:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
        project: [wealth-agent, business-analytics-agent]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    env:
      ENABLE_EXTERNAL_SERVICES: 'false'
      ENABLE_HISTORY: 'false'
      ENABLE_CODE_EXECUTION: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/requirements.txt
      - run: python -m pip install -r requirements.txt
      - if: matrix.project == 'wealth-agent'
        run: python -m pip install -r requirements-speech.txt
      - run: python -m pip check
      - run: python -m unittest discover -s service_tests -v
      - if: matrix.project == 'wealth-agent'
        run: python evals/evaluate_contracts.py
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt pydantic==2.11.3
      - run: python scripts/check_quality.py
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: business-analytics-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
  containers:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [wealth-agent, business-analytics-agent]
    steps:
      - uses: actions/checkout@v4
      - name: Build service image and check its health endpoint
        shell: bash
        run: |
          docker build -t portfolio-service ${{ matrix.project }}
          docker run -d --name portfolio-service -p 8000:8000 portfolio-service
          trap 'docker logs portfolio-service; docker rm -f portfolio-service' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-delay 2 http://localhost:8000/healthz
